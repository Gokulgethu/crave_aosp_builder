# PixelOS Build - ULTIMATE FIX
# Handles Ubuntu 24.04 properly with all fixes

name: Build PixelOS for Poco M3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    
    steps:
      - name: Debug Info
        run: |
          echo "=== SYSTEM INFO ==="
          cat /etc/os-release | head -5
          echo ""
          echo "=== AVAILABLE PACKAGES TEST ==="
          apt-cache show libncurses6 2>/dev/null | head -3 || echo "libncurses6 available"
          apt-cache show ccache 2>/dev/null | head -3 || echo "ccache available"
          
      - name: Install Git and Basic Tools
        run: |
          echo "=== STEP 1: Git and Basic Tools ==="
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl wget
          git --version
          
      - name: Install Python and Java
        run: |
          echo "=== STEP 2: Python and Java ==="
          sudo apt-get install -y python3 openjdk-17-jdk
          java -version 2>&1 | head -1
          
      - name: Install Build Tools (Split)
        run: |
          echo "=== STEP 3: Build Tools Part 1 ==="
          sudo apt-get install -y build-essential gcc g++ make
          make --version | head -1
          
      - name: Install Dev Libraries
        run: |
          echo "=== STEP 4: Dev Libraries ==="
          # FIX: Ubuntu 24.04 uses libncurses6 not libncurses5
          sudo apt-get install -y \
            libncurses6 libncurses6-dev \
            libxml2-dev libxslt-dev \
            zlib1g-dev \
            bc bison flex \
            cpio zip unzip gzip tar xz-utils \
            rsync lzop
          echo "=== Libraries installed ==="
          
      - name: Install ccache
        run: |
          echo "=== STEP 5: Installing ccache ==="
          sudo apt-get install -y ccache
          which ccache || echo "ccache not in PATH"
          ccache --version || echo "ccache failed"
          
      - name: Verify All Commands
        run: |
          echo "=== VERIFICATION ==="
          echo "git: $(which git)"
          echo "java: $(which java)"
          echo "python3: $(which python3)"
          echo "make: $(which make)"
          echo "gcc: $(which gcc)"
          echo "ccache: $(which ccache)"
          echo "curl: $(which curl)"
          echo "repo: $(which repo || echo 'NOT YET INSTALLED')"
          
      - name: Install Repo Tool
        run: |
          echo "=== STEP 6: Installing Repo Tool ==="
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ./repo
          chmod +x ./repo
          sudo mv ./repo /usr/local/bin/repo
          /usr/local/bin/repo version 2>&1 | head -1
          echo "Repo installed at: $(which repo)"
          
      - name: Configure Git
        run: |
          echo "=== STEP 7: Git Config ==="
          git config --global user.email "builder@github.com"
          git config --global user.name "GitHub Actions"
          git config --global http.postBuffer 524288000
          git config --global fetch.fsckobjects false
          git config --global gc.auto 0
          echo "Git configured"
          
      - name: Setup Java
        run: |
          echo "=== STEP 8: Java Environment ==="
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "export JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV
          java -version 2>&1 | head -1
          
      - name: Setup ccache
        run: |
          echo "=== STEP 9: ccache Setup ==="
          ccache -M 100G
          ccache -z
          ccache -s | head -3
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          
      - name: Initialize Android Repo
        run: |
          echo "=== STEP 10: Initialize Android Repository ==="
          
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="/usr/local/bin:$JAVA_HOME/bin:$PATH"
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          
          echo "PATH=$PATH"
          echo "JAVA_HOME=$JAVA_HOME"
          
          mkdir -p pixelos
          cd pixelos
          
          echo "Current directory: $(pwd)"
          echo "Repo location: $(which repo)"
          
          /usr/local/bin/repo init \
            -u https://github.com/PixelOS-AOSP/android_manifest.git \
            -b fourteen \
            --git-lfs \
            --depth=1 \
            --no-tags 2>&1 | tail -30
          
          echo ""
          echo "=== Init Result ==="
          if [ -d ".repo" ]; then
            echo "SUCCESS: .repo directory created"
            ls -la .repo/ | head -5
          else
            echo "FAILED: .repo directory not created"
            exit 1
          fi
          
      - name: Sync Android Sources
        run: |
          echo "=== STEP 11: Syncing Sources ==="
          
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="/usr/local/bin:$JAVA_HOME/bin:$PATH"
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          
          cd pixelos
          
          echo "Syncing (this takes 30-60 minutes)..."
          /usr/local/bin/repo sync -c -j4 --force-sync --no-clone-bundle --prune 2>&1 | tail -50
          
          echo ""
          du -sh .
          
      - name: Clone Device Trees
        run: |
          echo "=== STEP 12: Cloning Device Trees ==="
          
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="/usr/local/bin:$JAVA_HOME/bin:$PATH"
          
          cd pixelos
          
          # Clone device tree
          echo "Cloning device tree..."
          git clone --depth=1 https://github.com/PixelOS-Devices/device_xiaomi_chime.git device/xiaomi/chime || echo "Device tree clone failed"
          
          # Clone vendor
          echo "Cloning vendor..."
          git clone --depth=1 https://github.com/PixelOS-Devices/vendor_xiaomi_chime.git vendor/xiaomi/chime || echo "Vendor clone failed"
          
          echo ""
          echo "=== Device Trees ==="
          ls -la device/xiaomi/ 2>/dev/null || echo "No device trees"
          
      - name: Build ROM
        id: build
        run: |
          echo "=== STEP 13: Building ROM ==="
          
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="/usr/local/bin:$JAVA_HOME/bin:$PATH"
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          
          cd pixelos
          
          # Source build environment
          source build/envsetup.sh
          
          echo ""
          echo "=== Available Makefiles ==="
          find device/xiaomi -name "*.mk" 2>/dev/null | head -10
          
          echo ""
          echo "=== Selecting Lunch Target ==="
          
          # Try different targets
          if [ -f "device/xiaomi/chime/aosp_citrus.mk" ]; then
            lunch aosp_citrus-userdebug
          elif [ -f "device/xiaomi/chime/chime.mk" ]; then
            lunch chime-userdebug
          elif [ -f "device/xiaomi/chime/citrus.mk" ]; then
            lunch citrus-userdebug
          else
            echo "Trying generic targets..."
            lunch aosp_citrus-userdebug 2>&1 || \
            lunch pixel_citrus-userdebug 2>&1 || \
            lunch lineage_citrus-userdebug 2>&1
          fi
          
          echo ""
          echo "=== Starting Build (may take 45-90 minutes) ==="
          make bacon -j$(nproc) 2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          
          echo ""
          echo "=== Build Result: $BUILD_EXIT ==="
          
          # Find output
          find out -name "*.zip" 2>/dev/null | head -5
          
          # Copy to accessible location
          cp out/target/product/*/*.zip ./ROM.zip 2>/dev/null || true
          
          ls -la *.zip 2>/dev/null || echo "No ZIP found"
          
          exit $BUILD_EXIT
          
      - name: Show ccache Stats
        if: always()
        run: |
          echo "=== ccache Statistics ==="
          ccache -s 2>/dev/null | head -10 || echo "ccache not available"
          
      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-Citrus-ROM
          path: |
            pixelos/*.zip
            pixelos/out/**/product/**/*.zip
            pixelos/build.log
          retention-days: 7
          
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-Build-Logs
          path: |
            pixelos/build.log
            pixelos/out/**/*.log
          retention-days: 30
          
      - name: Final Summary
        if: always()
        run: |
          echo "=========================================="
          echo "FINAL BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Device: Xiaomi Poco M3 (citrus)"
          echo "ROM: PixelOS Android 14"
          echo ""
          cd pixelos 2>/dev/null || true
          echo "Output files:"
          find . -name "*.zip" 2>/dev/null | head -5 || echo "No ZIP files"
