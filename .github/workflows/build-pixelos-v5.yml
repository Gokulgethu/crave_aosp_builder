name: Build PixelOS for Poco M3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    
    steps:
      - name: Check Ubuntu Version
        run: |
          cat /etc/os-release | grep -E "^(NAME|VERSION)="
          apt-cache search ncurses | head -10

      - name: Update Package List
        run: |
          sudo apt-get update -qq
          echo "=== Package list updated ==="

      - name: Install Git
        run: |
          sudo apt-get install -y git git-lfs curl wget
          git --version

      - name: Install Python and Java
        run: |
          sudo apt-get install -y python3 openjdk-17-jdk
          java -version 2>&1 | head -1

      - name: Install Build Tools
        run: |
          sudo apt-get install -y \
            build-essential gcc g++ make \
            bc bison flex

      - name: Install Libraries
        run: |
          # Try different package names for ncurses
          sudo apt-get install -y \
            libncurses-dev \
            libncurses5-dev \
            libncurses++dev \
            ncurses-dev \
            2>/dev/null || \
          sudo apt-get install -y \
            libtinfo-dev \
            libncursesw6-dev \
            2>/dev/null || \
          sudo apt-get install -y \
            --no-install-recommends \
            libncurses6 libtinfo6 libncurses-dev

      - name: Install XML Libraries
        run: |
          sudo apt-get install -y \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev

      - name: Install Utilities
        run: |
          sudo apt-get install -y \
            cpio zip unzip gzip tar xz-utils \
            rsync lzop

      - name: Install ccache
        run: |
          sudo apt-get install -y ccache
          ccache --version

      - name: Install Repo Tool
        run: |
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o ./repo
          chmod +x ./repo
          sudo mv ./repo /usr/local/bin/repo
          /usr/local/bin/repo version 2>&1 | head -1

      - name: Configure Git
        run: |
          git config --global user.email "builder@github.com"
          git config --global user.name "GitHub Actions"
          git config --global http.postBuffer 524288000

      - name: Setup Java
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          java -version 2>&1 | head -1

      - name: Setup ccache
        run: |
          ccache -M 100G
          ccache -z
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Initialize Repository
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="/usr/local/bin:$JAVA_HOME/bin:$PATH"
          
          mkdir -p pixelos && cd pixelos
          
          /usr/local/bin/repo init \
            -u https://github.com/PixelOS-AOSP/android_manifest.git \
            -b fourteen --git-lfs --depth=1 2>&1 | tail -15
          
          echo "Init: $([ -d .repo ] && echo 'SUCCESS' || echo 'FAILED')"

      - name: Sync Sources
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="/usr/local/bin:$JAVA_HOME/bin:$PATH"
          
          cd pixelos
          /usr/local/bin/repo sync -c -j4 --force-sync 2>&1 | tail -20

      - name: Clone Device Trees
        run: |
          cd pixelos
          git clone --depth=1 https://github.com/PixelOS-Devices/device_xiaomi_chime.git device/xiaomi/chime || true
          git clone --depth=1 https://github.com/PixelOS-Devices/vendor_xiaomi_chime.git vendor/xiaomi/chime || true

      - name: Build ROM
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="/usr/local/bin:$JAVA_HOME/bin:$PATH"
          export USE_CCACHE=1
          
          cd pixelos
          source build/envsetup.sh
          
          lunch aosp_citrus-userdebug 2>&1 || \
          lunch chime-userdebug 2>&1 || \
          echo "Using default target"
          
          make bacon -j$(nproc) 2>&1 | tee build.log
          
          find out -name "*.zip" 2>/dev/null | head -5

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-Citrus
          path: pixelos/out/**/product/**/*.zip
          retention-days: 7
