name: Corvus OS 12 udon (template-style v2.3)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'userdebug'

concurrency:
  group: corvus12-udon-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    permissions:
      contents: write
    steps:
      - name: "Free disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/lib/jvm /opt/az /opt/pipx 2>/dev/null || true
          sudo apt-get clean || true
          df -h /

      - name: "Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 || true
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "udon-builder"
          git config --global user.email "builder@local"
          git config --global color.ui false

      - name: "Initialize Corvus 12 manifest"
        run: |
          mkdir -p android && cd android
          PATH=~/bin:$PATH repo init -u https://github.com/Corvus-AOSP/android_manifest.git -b 12 --depth=1

      - name: "Clone local manifest"
        run: |
          cd android
          rm -rf .repo/local_manifests
          git clone --depth=1 https://github.com/Gokulgethu/local_manifests.git .repo/local_manifests -b main
          cat .repo/local_manifests/udon-a12l.xml

      - name: "Validate manifest (30s, not 12min)"
        run: |
          cd android
          python3 - <<'PYEOF'
          import re, subprocess, sys
          xml = open('.repo/local_manifests/udon-a12l.xml').read()
          remotes = {m.group(1): (m.group(2), m.group(3) or '') for m in re.finditer(r'<remote name="([^"]+)" fetch="([^"]+)"(?: revision="([^"]+)")?', xml)}
          bad = 0
          for p in re.findall(r'<project (.*?)/>', xml):
              name = re.search(r'name="([^"]+)"', p).group(1)
              revm = re.search(r'revision="([^"]+)"', p)
              rname = re.search(r'remote="([^"]+)"', p).group(1)
              fetch, drev = remotes[rname]
              rev = revm.group(1) if revm else drev
              url = fetch.rstrip('/') + '/' + name + '.git'
              r = subprocess.run(['git', 'ls-remote', '--heads', url, rev], capture_output=True, text=True, timeout=90)
              ok = bool(r.stdout.strip())
              print(('OK  ' if ok else 'FAIL'), url.replace('https://', '')[:80], '@', rev)
              if not ok:
                  bad += 1
          print('BAD PROJECTS:', bad)
          sys.exit(1 if bad else 0)
          PYEOF

      - name: "Sync sources"
        run: |
          cd android
          PATH=~/bin:$PATH repo sync -c -j4 --force-sync --fail-fast \
            --no-clone-bundle --no-tags --optimized-fetch --prune || \
          { sleep 90; PATH=~/bin:$PATH repo sync -c -j4 --force-sync --fail-fast \
            --no-clone-bundle --no-tags --optimized-fetch --prune; }
          df -h /

      - name: "corvus_udon product shim (A12L compat + kernel engine)"
        run: |
          cd android
          INH=vendor/corvus/config/common.mk
          [ -f vendor/corvus/config/common_full_phone.mk ] && INH=vendor/corvus/config/common_full_phone.mk
          echo "corvus inherit target: $INH"

          # ---- 1. corvus_udon product makefile ----
          cat > device/oneplus/udon/corvus_udon.mk <<'EOF'
          # World-first A12L udon product (auto-generated)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, device/oneplus/udon/device.mk)
          $(call inherit-product, @INH@)
          PRODUCT_NAME := corvus_udon
          PRODUCT_DEVICE := udon
          PRODUCT_MANUFACTURER := OnePlus
          PRODUCT_BRAND := OnePlus
          PRODUCT_MODEL := CPH2487
          PRODUCT_GMS_CLIENTID_BASE := android-oneplus
          CORVUS_BUILDTYPE := UNOFFICIAL
          CORVUS_MAINTAINER := udon_builder
          EOF
          sed -i "s|@INH@|$INH|" device/oneplus/udon/corvus_udon.mk

          # Register product in AndroidProducts.mk - write canonical content cleanly
          cat > device/oneplus/udon/AndroidProducts.mk <<'EOF'
          #
          # Copyright (C) 2021 The LineageOS Project
          #
          # SPDX-License-Identifier: Apache-2.0
          #

          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/lineage_udon.mk \
              $(LOCAL_DIR)/corvus_udon.mk

          COMMON_LUNCH_CHOICES := \
              lineage_udon-user \
              corvus_udon-userdebug \
              lineage_udon-userdebug \
              lineage_udon-eng
          EOF

          # Swap lineage vendor inherit for corvus
          sed -i "s|vendor/lineage/config/common_full_phone.mk|$INH|" \
            device/oneplus/udon/lineage_udon.mk device/oneplus/sm8450-common/common.mk 2>/dev/null || true

          # ---- 2. Disable A13 prebuilt-kernel-platform path ----
          sed -i 's|^TARGET_USES_KERNEL_PLATFORM ?= true|TARGET_USES_KERNEL_PLATFORM := false|' \
            device/oneplus/sm8450-common/kernel/kernel-platform-product.mk \
            device/oneplus/sm8450-common/kernel/kernel-platform-board.mk

          # ---- 3. Stub missing qcom kernel-DDK makefiles ----
          # A13 sm8450-common references ~14 kernel-DDK vendor repos that don't exist in A12L.
          # Auto-discover every $(call inherit-product/include) of vendor/qcom/opensource/.../*.mk
          # under device/ + vendor/oneplus/ and stub missing ones as empty.
          STUB_COUNT=0
          for src in device/oneplus/sm8450-common device/oneplus/udon vendor/oneplus/sm8450-common vendor/oneplus/udon; do
            [ -d "$src" ] || continue
            while IFS= read -r mk; do
              [ -z "$mk" ] && continue
              mkf="${mk%% *}"  # strip trailing junk
              case "$mkf" in vendor/qcom/opensource/*.mk) ;; *) continue;; esac
              if [ ! -f "$mkf" ]; then
                mkdir -p "$(dirname "$mkf")"
                echo "# A12L stub (DDK module built in kernel source tree)" > "$mkf"
                STUB_COUNT=$((STUB_COUNT+1))
              fi
            done < <(grep -rhoE 'vendor/qcom/opensource/[A-Za-z0-9_./-]+\.mk' "$src" 2>/dev/null | sort -u)
          done
          echo "stubs created: $STUB_COUNT"

          # ---- 4. Wire source-kernel build (vendor_lineage LOS19 kernel engine) ----
          # vendor/lineage ships a Soong plugin that collides with Corvus' own generator
          # package context. We only need build/tasks/kernel.mk — drop the rest.
          rm -rf vendor/lineage/build/soong
          rm -rf vendor/lineage/lineage-sdk vendor/lineage/packages 2>/dev/null || true
          if ! grep -q 'TARGET_KERNEL_SOURCE :=' device/oneplus/sm8450-common/BoardConfigCommon.mk; then
            cat >> device/oneplus/sm8450-common/BoardConfigCommon.mk <<'EOF'

          # A12L world-first: 5.10 GKI kernel from source (vendor_lineage engine)
          TARGET_KERNEL_SOURCE := kernel/oneplus/sm8450
          TARGET_KERNEL_CONFIG := gki_defconfig
          TARGET_KERNEL_CLANG_COMPILE := true
          TARGET_KERNEL_CLANG_PATH := prebuilts/clang/host/linux-x86/weebx-clang
          TARGET_KERNEL_USES_LLVM := true
          BOARD_KERNEL_IMAGE_NAME := Image
          EOF
          fi
          grep -q 'vendor/lineage/build/tasks/kernel.mk' device/oneplus/sm8450-common/BoardConfigCommon.mk || \
            echo '-include vendor/lineage/build/tasks/kernel.mk' >> device/oneplus/sm8450-common/BoardConfigCommon.mk
          grep -q 'BOARD_INCLUDE_DTB_IN_BOOTIMG' device/oneplus/sm8450-common/BoardConfigCommon.mk || \
            echo 'BOARD_INCLUDE_DTB_IN_BOOTIMG := true' >> device/oneplus/sm8450-common/BoardConfigCommon.mk

          # ---- 5. GApps check ----
          ls vendor/google/gms >/dev/null 2>&1 && echo "GApps: present" || echo "WARN: GApps missing"

          # ---- 6. Soong namespace fixes ----
          # display-commonsys-intf declares its own soong_namespace{} (isolating display_intf_headers)
          # but hardware/qcom-caf/sm8450/display lives in root namespace and needs it. Flatten it to root.
          if [ -f vendor/qcom/opensource/display-commonsys-intf/Android.bp ]; then
            sed -i '/^soong_namespace {$/,/^}$/d' vendor/qcom/opensource/display-commonsys-intf/Android.bp
            echo "Flattened display-commonsys-intf into root soong namespace"
          fi
          # Append missing namespaces to PRODUCT_SOONG_NAMESPACES
          for ns in vendor/qcom/opensource/display-commonsys-intf packages/resources/devicesettings hardware/oplus; do
            if ! grep -qr "PRODUCT_SOONG_NAMESPACES.*$ns" device/oneplus/sm8450-common device/oneplus/udon vendor/oneplus 2>/dev/null; then
              echo "PRODUCT_SOONG_NAMESPACES += $ns" >> device/oneplus/sm8450-common/common.mk
            fi
          done

          echo "=== AndroidProducts.mk ==="
          cat device/oneplus/udon/AndroidProducts.mk
          echo "=== tail BoardConfigCommon.mk ==="
          tail -20 device/oneplus/sm8450-common/BoardConfigCommon.mk

      - name: "Build ROM"
        run: |
          cd android
          set -o pipefail
          source build/envsetup.sh
          lunch corvus_udon-userdebug || lunch lineage_udon-userdebug
          mka bacon -j"$(nproc --all)" 2>&1 | tee build.log || \
          m bacon -j"$(nproc --all)" 2>&1 | tee build.log || \
          mka bacon -j2 2>&1 | tee build.log
          tail -60 build.log

      - name: "List artifacts"
        run: |
          cd android
          Z=$(ls out/target/product/udon/*.zip 2>/dev/null | head -1)
          echo "zip: $Z"
          test -f "$Z"
          ls -lh out/target/product/udon/*.zip out/target/product/udon/boot.img \
            out/target/product/udon/vendor_boot.img out/target/product/udon/dtbo.img 2>/dev/null || true

      - name: "Upload artifact"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Corvus12-udon-${{ github.run_number }}
          path: |
            android/out/target/product/udon/*.zip
            android/out/target/product/udon/boot.img
            android/out/target/product/udon/vendor_boot.img
            android/out/target/product/udon/dtbo.img
          if-no-files-found: warn

      - name: "Publish GitHub Release"
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: corvus12-udon-${{ github.run_number }}
          name: Corvus OS 12 (A12L) — OnePlus 11R (udon) — World First
          body: |
            **WORLD-FIRST Android 12L build for OnePlus 11R (udon/CPH2487)**
            - **ROM**: Corvus OS 12 (AOSP android-12.1.0_r8)
            - **Variant**: ${{ inputs.build_type }}
            - **GApps**: built-in (vendor_google_gms 12.1)
            - UNOFFICIAL experiment — flash via recovery, never relock bootloader
          files: |
            android/out/target/product/udon/*.zip
            android/out/target/product/udon/boot.img
            android/out/target/product/udon/vendor_boot.img
            android/out/target/product/udon/dtbo.img
          draft: false
          prerelease: true
