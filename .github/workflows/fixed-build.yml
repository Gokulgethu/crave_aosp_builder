# PixelOS Build - ROBUST FIXED VERSION
# Fixed: Exit code 127 (command not found), PATH issues

name: Build PixelOS for Poco M3

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user
          - eng

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    
    steps:
      # ═══════════════════════════════════════════════════
      # STEP 1: Full System Setup
      # ═══════════════════════════════════════════════════
      - name: Setup Environment
        run: |
          echo "=== STEP 1: Environment Setup ==="
          
          # Update system
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get dist-upgrade -y
          
          # Install ALL dependencies in ONE command
          sudo apt-get install -y \
            git git-lfs \
            python3 python3-pip python3-venv \
            openjdk-17-jdk \
            ccache \
            build-essential gcc g++ make \
            coreutils sed grep diffutils findutils \
            gzip tar bzip2 xz-utils zip unzip \
            bc bison flex \
            libncurses5 libncurses5-dev \
            libxml2 libxml2-utils libxslt-dev \
            zlib1g-dev \
            libffi-dev libssl-dev \
            cpio dpkg-dev \
            lzop pngquant schedtool \
            uuid-dev liblz4-tool \
            rsync curl wget \
            && sudo apt-get clean
          
          # Verify basic commands exist
          echo ""
          echo "=== Verifying Commands ==="
          which git || echo "ERROR: git not found"
          which python3 || echo "ERROR: python3 not found"
          which java || echo "ERROR: java not found"
          which make || echo "ERROR: make not found"
          which gcc || echo "ERROR: gcc not found"
          
          java -version 2>&1 | head -1
          python3 --version
          gcc --version | head -1
          
          echo ""
          echo "=== STEP 1 Complete ==="
      
      # ═══════════════════════════════════════════════════
      # STEP 2: Install Repo Tool Manually
      # ═══════════════════════════════════════════════════
      - name: Install Repo Tool
        run: |
          echo "=== STEP 2: Installing Repo Tool ==="
          
          # Download repo directly
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          
          # Check if download succeeded
          if [ ! -s /tmp/repo ]; then
            echo "Download failed, trying alternative..."
            wget -q https://storage.googleapis.com/git-repo-downloads/repo -O /tmp/repo 2>/dev/null || true
          fi
          
          # Move to bin
          sudo cp /tmp/repo /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo
          
          # Add to PATH explicitly
          echo 'export PATH="/usr/local/bin:$PATH"' >> $GITHUB_ENV
          export PATH="/usr/local/bin:$PATH"
          
          # Verify repo
          echo ""
          echo "=== Verifying Repo ==="
          /usr/local/bin/repo version 2>&1 || echo "Repo version check failed"
          which repo || echo "Repo not in PATH"
          
          echo ""
          echo "=== STEP 2 Complete ==="
      
      # ═══════════════════════════════════════════════════
      # STEP 3: Setup Java
      # ═══════════════════════════════════════════════════
      - name: Setup Java
        run: |
          echo "=== STEP 3: Java Setup ==="
          
          # Set Java environment
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          
          # Add to GitHub env
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH" >> $GITHUB_ENV
          
          # Verify
          java -version
          echo ""
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          
          echo ""
          echo "=== STEP 3 Complete ==="
      
      # ═══════════════════════════════════════════════════
      # STEP 4: Configure Git
      # ═══════════════════════════════════════════════════
      - name: Configure Git
        run: |
          echo "=== STEP 4: Git Configuration ==="
          
          git config --global user.email "builder@github.com"
          git config --global user.name "GitHub Actions"
          git config --global http.postBuffer 524288000
          git config --global fetch.fsckobjects false
          git config --global gc.auto 0
          
          echo ""
          echo "Git configured:"
          git config --global --list | head -5
          
          echo ""
          echo "=== STEP 4 Complete ==="
      
      # ═══════════════════════════════════════════════════
      # STEP 5: Setup ccache
      # ═══════════════════════════════════════════════════
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: pixelos-${{ github.run_id }}
          restore-keys: pixelos-
      
      - name: Configure ccache
        run: |
          echo "=== Configuring ccache ==="
          ccache -M 100G
          ccache -z
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          ccache -s | head -5
          echo ""
      
      # ═══════════════════════════════════════════════════
      # STEP 6: Initialize Repository
      # ═══════════════════════════════════════════════════
      - name: Initialize Repository
        run: |
          echo "=== STEP 6: Initializing Repository ==="
          
          # Ensure PATH is correct
          export PATH="/usr/local/bin:$JAVA_HOME/bin:/usr/bin:/bin:$PATH"
          
          # Create build directory
          mkdir -p pixelos
          cd pixelos
          
          echo "Working directory: $(pwd)"
          echo "Repo location: $(which repo || echo 'NOT FOUND')"
          
          # Initialize repo with RETRY
          echo ""
          echo "Initializing repo..."
          
          for i in 1 2 3; do
            echo ""
            echo "=== Attempt $i ==="
            
            /usr/local/bin/repo init \
              -u https://github.com/PixelOS-AOSP/android_manifest.git \
              -b fourteen \
              --git-lfs \
              --depth=1 \
              --no-tags \
              2>&1 | tail -30
            
            if [ -d ".repo" ]; then
              echo ""
              echo "✓ Repo initialized successfully!"
              break
            else
              echo ""
              echo "Attempt $i failed, retrying..."
              sleep 5
            fi
          done
          
          # Verify
          if [ -d ".repo" ]; then
            echo ""
            echo "=== Repo Verification ==="
            ls -la .repo/ | head -10
            echo ""
            echo "✓ STEP 6 Complete!"
          else
            echo ""
            echo "✗ REPO INIT FAILED"
            exit 1
          fi
      
      # ═══════════════════════════════════════════════════
      # STEP 7: Clone Device Trees
      # ═══════════════════════════════════════════════════
      - name: Clone Device Trees
        run: |
          echo "=== STEP 7: Cloning Device Trees ==="
          
          export PATH="/usr/local/bin:$JAVA_HOME/bin:/usr/bin:/bin:$PATH"
          cd pixelos
          
          # Device tree
          echo "Cloning device tree..."
          git clone --depth=1 https://github.com/PixelOS-Devices/device_xiaomi_chime.git device/xiaomi/chime || \
          git clone --depth=1 https://github.com/KiranPranay/device_xiaomi_chime.git device/xiaomi/chime || \
          echo "Device tree clone failed"
          
          # Vendor
          echo "Cloning vendor..."
          git clone --depth=1 https://github.com/PixelOS-Devices/vendor_xiaomi_chime.git vendor/xiaomi/chime || \
          git clone --depth=1 https://gitlab.com/chimeoss/vendor_xiaomi_chime.git vendor/xiaomi/chime || \
          echo "Vendor clone failed"
          
          # Kernel
          echo "Cloning kernel..."
          git clone --depth=1 https://github.com/PixelOS-Devices/kernel_xiaomi_sm6225.git kernel/xiaomi/sm6225 || \
          echo "Kernel clone failed"
          
          echo ""
          echo "=== Device Trees ==="
          ls -la device/xiaomi/ 2>/dev/null || echo "No device trees"
          find device/xiaomi -name "*.mk" 2>/dev/null | head -5
          
          echo ""
          echo "✓ STEP 7 Complete!"
      
      # ═══════════════════════════════════════════════════
      # STEP 8: Sync Sources
      # ═══════════════════════════════════════════════════
      - name: Sync Sources
        run: |
          echo "=== STEP 8: Syncing Sources ==="
          echo "This will take 30-60 minutes..."
          
          export PATH="/usr/local/bin:$JAVA_HOME/bin:/usr/bin:/bin:$PATH"
          cd pixelos
          
          # Sync with retry
          for i in 1 2; do
            echo ""
            echo "=== Sync Attempt $i ==="
            
            /usr/local/bin/repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --prune 2>&1 | tail -30
            
            if [ ${PIPESTATUS[0]} -eq 0 ]; then
              echo "Sync successful!"
              break
            fi
          done
          
          echo ""
          echo "Sync complete!"
          du -sh .
          
          echo ""
          echo "✓ STEP 8 Complete!"
      
      # ═══════════════════════════════════════════════════
      # STEP 9: Build
      # ═══════════════════════════════════════════════════
      - name: Build ROM
        id: build
        run: |
          echo "=== STEP 9: Building ROM ==="
          echo "This will take 45-90 minutes..."
          
          export PATH="/usr/local/bin:$JAVA_HOME/bin:/usr/bin:/bin:$PATH"
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          
          cd pixelos
          
          # Source build env
          source build/envsetup.sh
          
          # Try lunch
          echo ""
          echo "=== Finding Lunch Target ==="
          
          # Check available targets
          lunch pixel_citrus-${{ inputs.build_type }} 2>&1 || \
          lunch chime-${{ inputs.build_type }} 2>&1 || \
          lunch citrus-${{ inputs.build_type }} 2>&1 || \
          lunch aosp_citrus-${{ inputs.build_type }} 2>&1
          
          echo ""
          echo "=== Starting Build ==="
          
          # Build
          make bacon -j$(nproc) 2>&1 | tee build.log
          
          BUILD_RESULT=${PIPESTATUS[0]}
          
          echo ""
          echo "=== Build Result: $BUILD_RESULT ==="
          
          # Find output
          find out -name "*.zip" 2>/dev/null | head -5
          cp out/target/product/*/*.zip ./ROM.zip 2>/dev/null || true
          
          exit $BUILD_RESULT
      
      - name: Show ccache stats
        if: always()
        run: |
          echo "=== ccache Statistics ==="
          ccache -s | head -10 2>/dev/null || echo "No ccache"
      
      # ═══════════════════════════════════════════════════
      # STEP 10: Upload Artifacts
      # ═══════════════════════════════════════════════════
      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-Citrus-ROM
          path: |
            pixelos/*.zip
            pixelos/out/**/product/**/*.zip
            pixelos/build.log
          retention-days: 7
      
      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-Build-Logs
          path: |
            pixelos/build.log
            pixelos/out/**/*.log
          retention-days: 30
      
      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="
          echo "Status: ${{ job.status }}"
          echo "Device: Xiaomi Poco M3 (citrus)"
          echo "ROM: PixelOS Android 14"
          echo ""
          echo "Output:"
          find pixelos -name "*.zip" 2>/dev/null | head -5
