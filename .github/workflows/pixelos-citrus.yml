          
          cd android-build
          
          # Start build with all available cores
          make bacon -j$(nproc) 2>&1 | tee build.log
          
          BUILD_STATUS=${PIPESTATUS[0]}
          
          echo ""
          echo "=============================================="
          if [ $BUILD_STATUS -eq 0 ]; then
            echo "✅ BUILD SUCCESSFUL!"
          else
            echo "❌ BUILD FAILED!"
            echo "Check build.log for errors"
          fi
          echo "=============================================="
          
          # Show build output
          echo ""
          echo "Build artifacts:"
          ls -lh out/target/product/${{ env.DEVICE_CODENAME }}/*.zip 2>/dev/null || echo "No ZIP found"
          
          exit $BUILD_STATUS
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 12: Show ccache stats
      # ═══════════════════════════════════════════════════════════════
      - name: Show ccache stats
        if: always()
        run: |
          echo "=============================================="
          echo "ccache statistics:"
          echo "=============================================="
          ccache -s
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 13: Upload Build Artifacts
      # ═══════════════════════════════════════════════════════════════
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-${{ env.DEVICE_CODENAME }}-${{ inputs.build_type }}-${{ env.ROM_VERSION }}
          path: |
            android-build/out/target/product/${{ env.DEVICE_CODENAME }}/*.zip
            android-build/out/target/product/${{ env.DEVICE_CODENAME }}/*.img
            android-build/build.log
          retention-days: 7
          compression-level: 9
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 14: Upload Build Logs (on failure)
      # ═══════════════════════════════════════════════════════════════
      - name: Upload Build Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-${{ env.DEVICE_CODENAME }}-build-logs
          path: |
            android-build/build.log
            android-build/out/**/*.log
          retention-days: 30
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 15: Summary
      # ═══════════════════════════════════════════════════════════════
      - name: Build Summary
        if: always()
        run: |
          echo "=============================================="
          echo "📋 BUILD SUMMARY"
          echo "=============================================="
          echo "ROM: ${{ env.ROM_NAME }} ${{ env.ROM_VERSION }}"
          echo "Device: ${{ env.DEVICE_NAME }} (${{ env.DEVICE_CODENAME }})"
          echo "Build Type: ${{ inputs.build_type }}"
          echo "Status: ${{ job.status }}"
          echo ""
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Download your ROM from the Artifacts section above!"
            echo ""
            echo "Files included:"
            ls -lh android-build/out/target/product/${{ env.DEVICE_CODENAME }}/*.zip 2>/dev/null || true
          else
            echo "❌ Build failed. Check the logs for errors."
          fi
          echo "=============================================="

