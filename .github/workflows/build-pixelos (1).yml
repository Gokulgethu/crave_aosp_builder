# PixelOS Build Workflow for Poco M3 (citrus)
# 
# This workflow builds PixelOS Android 15 for Xiaomi Poco M3
# 
# FREE - Uses GitHub's hosted runners (6 hours per run, 50 hours/month)
#
# HOW TO USE:
# 1. Fork this repository
# 2. Go to Settings → Actions → General → Set "Workflow permissions" to "Read and write permissions"
# 3. Go to Actions → "Build PixelOS for Poco M3" → "Run workflow"
# 4. Wait 1-2 hours for the build to complete
# 5. Download your ROM from the Actions artifacts
#
# Copyright (C) 2024 The PixelOS Project

name: Build PixelOS for Poco M3

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user
          - eng
      clean_build:
        description: 'Clean Previous Build'
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  # Device Configuration
  DEVICE_CODENAME: citrus
  DEVICE_NAME: "Poco M3"
  DEVICE_MANUFACTURER: Xiaomi
  
  # ROM Configuration
  ROM_NAME: PixelOS
  ROM_VERSION: "15"
  MANIFEST_URL: https://github.com/PixelOS-AOSP/manifest
  MANIFEST_BRANCH: fifteen
  
  # Device Trees URLs
  DEVICE_TREE_URL: https://github.com/PixelOS-Devices/device_xiaomi_chime
  DEVICE_TREE_PATH: device/xiaomi/chime
  
  COMMON_TREE_URL: https://github.com/PixelOS-Devices/device_xiaomi_sm6225-common
  COMMON_TREE_PATH: device/xiaomi/sm6225-common
  
  VENDOR_URL: https://github.com/PixelOS-Devices/vendor_xiaomi_chime
  VENDOR_PATH: vendor/xiaomi/chime
  
  KERNEL_URL: https://github.com/PixelOS-Devices/kernel_xiaomi_sm6225
  KERNEL_PATH: kernel/xiaomi/sm6225
  
  # Build Configuration
  JAVA_VERSION: '17'
  USE_CCACHE: true
  CCACHE_SIZE: 100G

jobs:
  build:
    runs-on: ubuntu-latest
    
    timeout-minutes: 360  # 6 hours max
    
    steps:
      # ═══════════════════════════════════════════════════════════════
      # STEP 1: Checkout Repository
      # ═══════════════════════════════════════════════════════════════
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 2: Setup Python
      # ═══════════════════════════════════════════════════════════════
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 3: Setup Java JDK
      # ═══════════════════════════════════════════════════════════════
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          java-package: jdk
          cache: 'maven'
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 4: Install System Dependencies
      # ═══════════════════════════════════════════════════════════════
      - name: Install System Dependencies
        run: |
          echo "=============================================="
          echo "Installing build dependencies..."
          echo "=============================================="
          
          sudo apt-get update
          sudo apt-get install -y \
            git-core git-lfs gnupg flex bison curl \
            build-essential zip unzip xz-utils \
            zlib1g-dev libc6-dev libncurses5 \
            lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc fontconfig \
            libncurses5-dev libffi-dev \
            python3 python3-pip python3-setuptools \
            ccache bc bison build-essential \
            cpio dpkg-dev flex g++ gcc \
            kmod lib32z1-dev libncurses5-dev \
            libstdc++6 libtinfo2 lzop pngquant \
            schedtool u-boot-tools xsltproc \
            zip zlib1g-dev
          
          echo "=============================================="
          echo "Dependencies installed successfully!"
          echo "=============================================="
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 5: Setup ccache
      # ═══════════════════════════════════════════════════════════════
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.DEVICE_CODENAME }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.DEVICE_CODENAME }}-
      
      - name: Configure ccache
        run: |
          ccache -M ${{ env.CCACHE_SIZE }}
          ccache -z
          echo "CCACHE_SIZE=${{ env.CCACHE_SIZE }}" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 6: Initialize Android Repository
      # ═══════════════════════════════════════════════════════════════
      - name: Initialize Android Repository
        run: |
          echo "=============================================="
          echo "Initializing Android Repository..."
          echo "ROM: ${{ env.ROM_NAME }} ${{ env.ROM_VERSION }}"
          echo "Device: ${{ env.DEVICE_NAME }} (${{ env.DEVICE_CODENAME }})"
          echo "=============================================="
          
          mkdir -p android-build
          cd android-build
          
          repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }} \
            --git-lfs --depth=1 --no-tags
          
          echo "Repository initialized successfully!"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 7: Add Device Trees
      # ═══════════════════════════════════════════════════════════════
      - name: Clone Device Trees
        run: |
          echo "=============================================="
          echo "Cloning device-specific repositories..."
          echo "=============================================="
          
          cd android-build
          
          # Clone device tree
          echo "Cloning device tree..."
          git clone --depth=1 \
            ${{ env.DEVICE_TREE_URL }} \
            ${{ env.DEVICE_TREE_PATH }}
          
          # Clone common device tree
          echo "Cloning common device tree..."
          git clone --depth=1 \
            ${{ env.COMMON_TREE_URL }} \
            ${{ env.COMMON_TREE_PATH }}
          
          # Clone vendor
          echo "Cloning vendor..."
          git clone --depth=1 \
            ${{ env.VENDOR_URL }} \
            ${{ env.VENDOR_PATH }}
          
          # Clone kernel
          echo "Cloning kernel..."
          git clone --depth=1 \
            ${{ env.KERNEL_URL }} \
            --single-branch --branch ${{ env.ROM_NAME }}-${{ env.MANIFEST_BRANCH }} \
            ${{ env.KERNEL_PATH }} || \
          git clone --depth=1 \
            ${{ env.KERNEL_URL }} \
            ${{ env.KERNEL_PATH }}
          
          echo "Device trees cloned successfully!"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 8: Sync Sources
      # ═══════════════════════════════════════════════════════════════
      - name: Sync Android Sources
        uses: actions/cache@v4
        with:
          path: |
            android-build/.repo
          key: repo-${{ env.DEVICE_CODENAME }}-${{ github.run_id }}
          restore-keys: |
            repo-${{ env.DEVICE_CODENAME }}-
      
      - name: Sync Repository
        run: |
          echo "=============================================="
          echo "Syncing Android sources (this may take 30-60 min)..."
          echo "=============================================="
          
          cd android-build
          
          # Limit history to save space
          git config --global fetch.fsckobjects false
          git config --global gc.auto 0
          
          repo sync -c -j$(nproc) --force-sync \
            --no-clone-bundle --no-tags \
            --optimized-fetch --prune
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 9: Setup Build Environment
      # ═══════════════════════════════════════════════════════════════
      - name: Setup Build Environment
        run: |
          echo "=============================================="
          echo "Setting up build environment..."
          echo "=============================================="
          
          cd android-build
          
          # Source build environment
          source build/envsetup.sh
          
          # Setup ccache
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          ccache -M ${{ env.CCACHE_SIZE }}
          
          echo ""
          echo "Build environment ready!"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Python: $(python3 --version)"
          echo "ccache: $(ccache -s | head -1)"
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 10: Lunch Device
      # ═══════════════════════════════════════════════════════════════
      - name: Lunch Device
        run: |
          echo "=============================================="
          echo "Lunching ${{ env.DEVICE_NAME }}..."
          echo "=============================================="
          
          cd android-build
          
          # Check if device makefile exists
          if [ -f "device/xiaomi/chime/pixel_${{ env.DEVICE_CODENAME }}.mk" ]; then
            lunch pixel_${{ env.DEVICE_CODENAME }}-${{ inputs.build_type }}
          elif [ -f "device/xiaomi/chime/${{ env.DEVICE_CODENAME }}.mk" ]; then
            lunch ${{ env.DEVICE_CODENAME }}-${{ inputs.build_type }}
          else
            echo "Searching for correct lunch target..."
            lunch pixel_citrus-${{ inputs.build_type }} || \
            lunch chime-${{ inputs.build_type }} || \
            lunch ${{ env.DEVICE_CODENAME }}-${{ inputs.build_type }}
          fi
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 11: Build ROM
      # ═══════════════════════════════════════════════════════════════
      - name: Build PixelOS
        id: build
        run: |
          echo "=============================================="
          echo "🏗️  STARTING BUILD"
          echo "ROM: ${{ env.ROM_NAME }} ${{ env.ROM_VERSION }}"
          echo "Device: ${{ env.DEVICE_NAME }}"
          echo "Build Type: ${{ inputs.build_type }}"
          echo "=============================================="
          echo ""
          echo "This build will take approximately 1-2 hours."
          echo "Watch this workflow for progress..."
          echo ""
          
          cd android-build
          
          # Start build with all available cores
          make bacon -j$(nproc) 2>&1 | tee build.log
          
          BUILD_STATUS=${PIPESTATUS[0]}
          
          echo ""
          echo "=============================================="
          if [ $BUILD_STATUS -eq 0 ]; then
            echo "✅ BUILD SUCCESSFUL!"
          else
            echo "❌ BUILD FAILED!"
            echo "Check build.log for errors"
          fi
          echo "=============================================="
          
          # Show build output
          echo ""
          echo "Build artifacts:"
          ls -lh out/target/product/${{ env.DEVICE_CODENAME }}/*.zip 2>/dev/null || echo "No ZIP found"
          
          exit $BUILD_STATUS
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 12: Show ccache stats
      # ═══════════════════════════════════════════════════════════════
      - name: Show ccache stats
        if: always()
        run: |
          echo "=============================================="
          echo "ccache statistics:"
          echo "=============================================="
          ccache -s
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 13: Upload Build Artifacts
      # ═══════════════════════════════════════════════════════════════
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-${{ env.DEVICE_CODENAME }}-${{ inputs.build_type }}-${{ env.ROM_VERSION }}
          path: |
            android-build/out/target/product/${{ env.DEVICE_CODENAME }}/*.zip
            android-build/out/target/product/${{ env.DEVICE_CODENAME }}/*.img
            android-build/build.log
          retention-days: 7
          compression-level: 9
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 14: Upload Build Logs (on failure)
      # ═══════════════════════════════════════════════════════════════
      - name: Upload Build Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-${{ env.DEVICE_CODENAME }}-build-logs
          path: |
            android-build/build.log
            android-build/out/**/*.log
          retention-days: 30
      
      # ═══════════════════════════════════════════════════════════════
      # STEP 15: Summary
      # ═══════════════════════════════════════════════════════════════
      - name: Build Summary
        if: always()
        run: |
          echo "=============================================="
          echo "📋 BUILD SUMMARY"
          echo "=============================================="
          echo "ROM: ${{ env.ROM_NAME }} ${{ env.ROM_VERSION }}"
          echo "Device: ${{ env.DEVICE_NAME }} (${{ env.DEVICE_CODENAME }})"
          echo "Build Type: ${{ inputs.build_type }}"
          echo "Status: ${{ job.status }}"
          echo ""
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Download your ROM from the Artifacts section above!"
            echo ""
            echo "Files included:"
            ls -lh android-build/out/target/product/${{ env.DEVICE_CODENAME }}/*.zip 2>/dev/null || true
          else
            echo "❌ Build failed. Check the logs for errors."
          fi
          echo "=============================================="
