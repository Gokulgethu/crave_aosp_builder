name: ROM Pull-out Watcher (light)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up b5b1abe workspace identity (hostname + anchor)
        run: |
          sudo hostname e2b.local
          grep -q "e2b.local" /etc/hosts || echo "127.0.0.1 e2b.local" | sudo tee -a /etc/hosts
          sudo mkdir -p /home/user
          sudo chown -R $(id -un):$(id -gn) /home/user
          mkdir -p /home/user/crave-build/PixelOS16-udon
          cd /home/user/crave-build/PixelOS16-udon
          git init -q -b seventeen
          git remote add origin https://github.com/PixelOS-AOSP/android_manifest.git
          git config user.name "Gokulgethu"
          git config user.email "gokulgethu30@gmail.com"
          git commit -q --allow-empty -m "PixelOS 16 udon anchor"

      - name: Install crave CLI (0.2-7226)
        run: |
          curl -sL -o /tmp/crave https://github.com/accupara/crave/releases/download/0.2-7226/crave-0.2-7226-linux-amd64.bin
          chmod +x /tmp/crave
          sudo mv /tmp/crave /usr/local/bin/crave

      - name: Configure crave
        run: |
          cat > ${HOME}/crave.conf <<CONFEOF
          {
            "username": "${CRAVE_USERNAME}",
            "headers": {
              "Content-Type": "application/json",
              "Authorization": "${CRAVE_TOKEN}",
              "User-Agent": "Crave"
            },
            "projects": [],
            "server": "https://foss.crave.io/api"
          }
          CONFEOF
          if grep -q '\${' ${HOME}/crave.conf; then echo "FATAL: unsubstituted placeholders"; exit 1; fi
          python3 -c "import json; json.load(open('${HOME}/crave.conf'))" && echo "crave.conf JSON valid"
        env:
          CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
          CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

      - name: Check rebuild 299692 - exec pull-out the moment it is running
        run: |
          cd /home/user/crave-build/PixelOS16-udon
          export CRAVE_HOME=${HOME}
          TOKEN=$(python3 -c "import json;print(json.load(open('$HOME/crave.conf'))['headers']['Authorization'])")
          ST=$(curl -s -X POST -H "Authorization: $TOKEN" -H "Content-Type: application/json" -d '{"jobId":299692}' https://foss.crave.io/api/job/v1/get | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['status'])" 2>/dev/null || echo err)
          echo "rebuild 299692: $ST"
          if [ "$ST" = "done" ]; then
            echo "rebuild finished - its own log has the upload links"
            exit 0
          fi
          if [ "$ST" != "running" ]; then
            echo "not running yet - short check, exiting"
            exit 0
          fi
          echo "=== rebuild RUNNING - exec-ing pull-out inside it (299487 zip still in out/) ==="
          timeout 2400 crave exec --current-job --label "rom-pullout-${GITHUB_RUN_ID}" "$(cat ${GITHUB_WORKSPACE}/rescue.sh)"
          echo "EXEC_DONE - links above"
